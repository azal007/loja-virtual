services:
  db:
    image: mysql:8.2
    container_name: mysql-loja-virtual
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: lojavirtual
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
